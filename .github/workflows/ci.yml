name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commit format
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          PATTERN="^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\(.+\))?!?: .+"
          if [[ ! "$TITLE" =~ $PATTERN ]]; then
            echo "❌ PR title does not follow conventional commit format."
            echo ""
            echo "Expected: <type>(<optional scope>): <description>"
            echo "Types: feat, fix, chore, docs, style, refactor, perf, test, build, ci, revert"
            echo ""
            echo "Examples:"
            echo "  feat: add donation export"
            echo "  fix(auth): resolve session timeout"
            echo "  chore: update dependencies"
            exit 1
          fi
          echo "✅ PR title is valid: $TITLE"

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.1.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec oxlint --format github src/

      - name: TypeScript type check
        run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the diff-scoped gates need origin/main and the branch commits.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.1.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm run test

      - name: Coverage
        run: pnpm run test:coverage

      - name: Changed-line coverage
        run: node scripts/changed-line-coverage.mjs --base origin/main

      - name: Floor guard (CONSTRAINTS.md exceptions and floor)
        run: node scripts/floor-guard.mjs --base origin/main

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.1.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Bundle budget
        run: node scripts/bundle-budget.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
