name: Release

on:
  push:
    branches: [main]
  pull_request: # TEMP: validation run, revert before merge
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # TEMP
    timeout-minutes: 10
    permissions:
      contents: write
      # release-please creates and sets the "autorelease: *" labels it uses to track release PRs
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  docker-publish:
    name: docker-publish
    needs: release-please
    if: "!cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'pull_request')" # TEMP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # NODE_AUTH_TOKEN pulls @jorgetroya80/donations-api-client from GitHub Packages (npm)
      packages: read
    steps:
      # Build from the release tag, not github.sha: they differ if the tag is created by a later push
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || 'donations-frontend-v0.3.18' }} # TEMP
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        name: Image tags X.Y.Z, X.Y and latest from the release tag
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: jorgetroya/donations-frontend
          # The workflow runs on push to main, not on a tag event, so the version comes from
          # release-please and "latest" must be explicit. Use version, not tag_name: the tag
          # carries the component prefix (donations-frontend-vX.Y.Z), which is not semver
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.version || '0.3.18' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.version || '0.3.18' }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }} # TEMP
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            NODE_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
